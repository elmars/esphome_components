name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Protocol unit tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I components/jiecang_desk_controller \
            -o test_protocol tests/test_jiecang_protocol.cpp
          ./test_protocol

  esphome-compile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [tests/ci_esp32c3.yaml, tests/ci_esp8266.yaml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements.txt
      - run: esphome compile ${{ matrix.config }}
